<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<title>Cobra Master Tape</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: #0b1120; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; padding: 10px; justify-content: space-between; overflow: hidden; }
  .display-box { background: #1e293b; border-radius: 8px; padding: 8px 12px; text-align: center; border: 1px solid #334155; }
  .val-main { font-size: 1.4rem; font-weight: 800; color: #f59e0b; }
  .val-target { font-size: 1.1rem; font-weight: 700; color: #ef4444; margin-top: 2px; }
  .tape-container { width: 100%; height: 95px; background: #0b1120; border-radius: 6px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; }
  .grid-scales { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
  .btn-scale { background: #1e293b; color: #38bdf8; border: 1px solid #334155; border-radius: 6px; padding: 8px 4px; font-size: 0.85rem; font-weight: 700; text-align: center; }
  .btn-scale.active { background: #38bdf8; color: #0b1120; }
  .grid-numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .btn-pad { background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; font-size: 1.3rem; font-weight: 700; height: 50px; display: flex; align-items: center; justify-content: center; }
  .btn-pad:active, .btn-scale:active { filter: brightness(1.3); }
  .btn-op { background: #d97706; color: #fff; }
  .btn-clear { background: #dc2626; color: #fff; }
  .btn-eq { background: #059669; color: #fff; }
  .btn-half { background: #0284c7; color: #fff; font-size: 0.95rem; }
</style>
</head>
<body>
  <div class="display-box">
    <div class="val-main" id="disp-main">38" = 96.5 cm</div>
    <div class="val-target" id="disp-target">Cap Drop (1/8 - 1/2"): 4 1/4"</div>
  </div>
  <div class="tape-container">
    <canvas id="tapeCanvas"></canvas>
  </div>
  <div class="grid-scales" id="scaleGrid"></div>
  <div class="grid-numpad" id="numPad"></div>

<script>
  let calcExpr = "38";
  let activeVal = 38.0;
  let activeMark = (38.0 / 8.0) - 0.5;
  let activeLabel = 'Cap Drop (1/8 - 1/2")';

  const scales = [
    { label: "1/2 (Halves)", val: 2 }, { label: "1/3 (3rds)", val: 3 },
    { label: "1/4 (4ths)", val: 4 }, { label: "1/6 (6ths)", val: 6 },
    { label: "1/8 (8ths)", val: 8 }, { label: "1/12 (12ths)", val: 12 },
    { label: "1/16 (16ths)", val: 16 }, { label: "1/24 (24ths)", val: 24 },
    { label: "Cap Drop (-1/2\")", val: "cap" }, { label: "Bicep (-1/2\")", val: "bic" }
  ];

  const padKeys = [
    { k: 'C', c: 'btn-clear' }, { k: '(', c: '' }, { k: ')', c: '' }, { k: '/', c: 'btn-op' },
    { k: '7', c: '' }, { k: '8', c: '' }, { k: '9', c: '' }, { k: '*', c: 'btn-op' },
    { k: '4', c: '' }, { k: '5', c: '' }, { k: '6', c: '' }, { k: '-', c: 'btn-op' },
    { k: '1', c: '' }, { k: '2', c: '' }, { k: '3', c: '' }, { k: '+', c: 'btn-op' },
    { k: '0', c: '' }, { k: '.', c: '' }, { k: '+1/2', c: 'btn-half' }, { k: '=', c: 'btn-eq' }
  ];

  function toFraction(val) {
    if (val <= 0) return '0"';
    let whole = Math.floor(val);
    let rem = val - whole;
    let eighths = Math.round(rem * 8);
    if (eighths === 0) return whole + '"';
    if (eighths === 8) return (whole + 1) + '"';
    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    let div = gcd(eighths, 8);
    let num = eighths / div;
    let den = 8 / div;
    return (whole > 0 ? whole + ' ' : '') + num + '/' + den + '"';
  }

  function renderScales() {
    const grid = document.getElementById('scaleGrid');
    grid.innerHTML = '';
    scales.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'btn-scale' + (s.label === activeLabel ? ' active' : '');
      btn.innerText = s.label;
      btn.onclick = () => selectScale(s);
      grid.appendChild(btn);
    });
  }

  function renderPad() {
    const pad = document.getElementById('numPad');
    pad.innerHTML = '';
    padKeys.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'btn-pad ' + p.c;
      btn.innerText = p.k;
      btn.onclick = () => handleInput(p.k);
      pad.appendChild(btn);
    });
  }

  function selectScale(s) {
    activeLabel = s.label;
    if (s.val === 'cap') activeMark = (activeVal / 8) - 0.5;
    else if (s.val === 'bic') activeMark = (activeVal / 4) - 0.5;
    else activeMark = activeVal / s.val;
    updateDisplay();
    renderScales();
    drawTape();
  }

  function handleInput(k) {
    if (k === 'C') { calcExpr = "0"; }
    else if (k === '=') {
      try { calcExpr = String(Math.round(eval(calcExpr) * 1000) / 1000); }
      catch(e) { calcExpr = "Error"; }
    } else if (k === '+1/2') {
      try { calcExpr = String(Math.round((eval(calcExpr) + 0.5) * 1000) / 1000); }
      catch(e) {}
    } else {
      if (calcExpr === "0" || calcExpr === "Error") calcExpr = k;
      else calcExpr += k;
    }
    try { activeVal = parseFloat(eval(calcExpr)) || 0; } catch(e) {}
    const curScale = scales.find(s => s.label === activeLabel) || scales[8];
    selectScale(curScale);
  }

  function updateDisplay() {
    document.getElementById('disp-main').innerText = calcExpr + '" = ' + (activeVal * 2.54).toFixed(1) + ' cm';
    document.getElementById('disp-target').innerText = activeLabel + ': ' + toFraction(activeMark);
  }

  const canvas = document.getElementById('tapeCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
    canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
    drawTape();
  }

  function drawTape() {
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    const span = 3.0;
    const startInch = Math.max(0, activeMark - (span / 2));
    const pxPerInch = w / span;

    ctx.fillStyle = "#facc15";
    ctx.fillRect(0, 8, w, h - 16);

    ctx.fillStyle = "#0f172a";
    ctx.strokeStyle = "#0f172a";
    const totalEighths = Math.floor(span * 8) + 2;
    const firstEighth = Math.floor(startInch * 8);

    for (let i = 0; i < totalEighths + 2; i++) {
      const cur8 = firstEighth + i;
      const curInch = cur8 / 8;
      const x = (curInch - startInch) * pxPerInch;
      if (x < 0 || x > w) continue;

      const sub = cur8 % 8;
      let tickLen = 14;
      let lineW = 1.5;

      if (sub === 0) {
        tickLen = 42;
        lineW = 3.5;
        ctx.font = "bold " + (16 * window.devicePixelRatio) + "px sans-serif";
        ctx.fillText(curInch, x + 6, h - 22);
      } else if (sub === 4) {
        tickLen = 30;
        lineW = 2.5;
      } else if (sub === 2 || sub === 6) {
        tickLen = 22;
        lineW = 2;
      }

      ctx.lineWidth = lineW;
      ctx.beginPath();
      ctx.moveTo(x, 8);
      ctx.lineTo(x, 8 + tickLen);
      ctx.stroke();
    }

    const redX = (activeMark - startInch) * pxPerInch;
    if (redX >= 0 && redX <= w) {
      ctx.strokeStyle = "#ef4444";
      ctx.fillStyle = "#ef4444";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(redX, 0);
      ctx.lineTo(redX, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(redX - 10, 0);
      ctx.lineTo(redX + 10, 0);
      ctx.lineTo(redX, 16);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(redX, h / 2, 5 * window.devicePixelRatio, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  window.addEventListener('resize', resizeCanvas);
  renderScales();
  renderPad();
  updateDisplay();
  resizeCanvas();
</script>
</body>
</html>
