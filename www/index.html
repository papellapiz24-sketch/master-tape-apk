<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Proportional Tape Measure</title>
<style>
  :root {
    --bg-main: #0d1117;
    --panel-bg: #161b22;
    --border-color: #30363d;
    --text-pri: #f0f6fc;
    --text-mut: #8b949e;
    --accent-amber: #d29922;
    --accent-blue: #58a6ff;
    --accent-red: #ef4444;
    --btn-numpad: #21262d;
    --btn-scale: #161b22;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-pri);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px;
    justify-content: space-between;
    overflow: hidden;
  }

  .top-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .input-preview-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .input-expr {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--accent-amber);
    letter-spacing: -0.3px;
  }

  .input-subtext {
    font-size: 0.8rem;
    color: var(--text-mut);
    font-weight: 500;
  }

  .grid-numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  .btn-pad {
    background: var(--btn-numpad);
    color: var(--text-pri);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 1.05rem;
    font-weight: 600;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, filter 0.1s;
  }

  .btn-pad:active, .btn-scale:active {
    transform: scale(0.96);
    filter: brightness(1.3);
  }

  .btn-op { background: #38280f; color: #e3b341; border-color: #bb8009; }
  .btn-clear { background: #3c1e1e; color: #ff7b72; border-color: #f85149; }
  .btn-eq { background: #1b382b; color: #56d364; border-color: #2ea043; }
  .btn-half { background: #162c46; color: #79c0ff; border-color: #388bfd; font-size: 0.85rem; }

  .grid-scales {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  .btn-scale {
    background: var(--btn-scale);
    color: var(--accent-blue);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 7px 2px;
    font-size: 0.78rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: all 0.1s ease;
  }

  .btn-scale.active {
    background: #1f6feb;
    color: #ffffff;
    border-color: #58a6ff;
    box-shadow: 0 0 8px rgba(88, 166, 255, 0.4);
  }

  .bottom-stack {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel-bg);
  }

  .result-banner {
    padding: 8px 12px;
    background: linear-gradient(180deg, #1f242c 0%, #161b22 100%);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .result-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-mut);
  }

  .result-val {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--accent-red);
  }

  .tape-container {
    width: 100%;
    height: 105px;
    background: #090d16;
    position: relative;
    margin: 0;
    padding: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>

  <div class="top-section">
    <div class="input-preview-bar">
      <div class="input-expr" id="disp-expr">38</div>
      <div class="input-subtext">Tap scale below to calculate</div>
    </div>
    <div class="grid-numpad" id="numPad"></div>
  </div>

  <div class="grid-scales" id="scaleGrid"></div>

  <div class="bottom-stack">
    <div class="result-banner">
      <span class="result-title" id="res-scale-name">1/8 of 38"</span>
      <span class="result-val" id="res-scale-val">4 3/4"</span>
    </div>
    <div class="tape-container">
      <canvas id="tapeCanvas"></canvas>
    </div>
  </div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    let calcExpr = "38";
    let committedBaseVal = 38.0;
    let activeMark = 38.0 / 8.0;
    let activeLabel = "1/8";
    let activeDivisor = 8;

    const scales = [
      { label: "1/2", val: 2 },
      { label: "1/3", val: 3 },
      { label: "1/4", val: 4 },
      { label: "1/6", val: 6 },
      { label: "1/8", val: 8 },
      { label: "1/10", val: 10 },
      { label: "1/12", val: 12 },
      { label: "1/16", val: 16 }
    ];

    const padKeys = [
      { k: 'C', c: 'btn-clear' }, { k: '⌫', c: '' }, { k: '/', c: 'btn-op' }, { k: '*', c: 'btn-op' },
      { k: '7', c: '' }, { k: '8', c: '' }, { k: '9', c: '' }, { k: '-', c: 'btn-op' },
      { k: '4', c: '' }, { k: '5', c: '' }, { k: '6', c: '' }, { k: '+', c: 'btn-op' },
      { k: '1', c: '' }, { k: '2', c: '' }, { k: '3', c: '' }, { k: '+1/2', c: 'btn-half' },
      { k: '0', c: '' }, { k: '.', c: '' }, { k: '(', c: '' }, { k: '=', c: 'btn-eq' }
    ];

    function toFraction(val) {
      if (val <= 0) return '0"';
      const whole = Math.floor(val);
      const rem = val - whole;
      const eighths = Math.round(rem * 8);
      if (eighths === 0) return `${whole}"`;
      if (eighths === 8) return `${whole + 1}"`;

      function gcd(a, b) { return b ? gcd(b, a % b) : a; }
      const div = gcd(eighths, 8);
      const num = eighths / div;
      const den = 8 / div;
      return `${whole > 0 ? whole + ' ' : ''}${num}/${den}"`;
    }

    function renderScales() {
      const grid = document.getElementById('scaleGrid');
      grid.innerHTML = '';
      scales.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'btn-scale' + (s.label === activeLabel ? ' active' : '');
        btn.innerText = s.label;
        btn.onclick = () => executeScaleCalculation(s);
        grid.appendChild(btn);
      });
    }

    function renderPad() {
      const pad = document.getElementById('numPad');
      pad.innerHTML = '';
      padKeys.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'btn-pad ' + p.c;
        btn.innerText = p.k;
        btn.onclick = () => handlePadInput(p.k);
        pad.appendChild(btn);
      });
    }

    function handlePadInput(k) {
      if (k === 'C') {
        calcExpr = "0";
      } else if (k === '⌫') {
        calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : "0";
      } else if (k === '=') {
        try {
          const evaluated = Function('"use strict";return (' + calcExpr + ')')();
          calcExpr = String(Math.round(evaluated * 1000) / 1000);
        } catch(e) {
          calcExpr = "Error";
        }
      } else if (k === '+1/2') {
        try {
          const evaluated = Function('"use strict";return (' + calcExpr + ')')();
          calcExpr = String(Math.round((evaluated + 0.5) * 1000) / 1000);
        } catch(e) {}
      } else {
        if (calcExpr === "0" || calcExpr === "Error") calcExpr = k;
        else calcExpr += k;
      }
      document.getElementById('disp-expr').innerText = calcExpr;
    }

    function executeScaleCalculation(scaleObj) {
      try {
        const evaluated = Function('"use strict";return (' + calcExpr + ')')();
        committedBaseVal = Math.max(0, parseFloat(evaluated) || 0);
      } catch(e) {
        committedBaseVal = 0;
      }

      activeLabel = scaleObj.label;
      activeDivisor = scaleObj.val;
      activeMark = committedBaseVal / activeDivisor;

      document.getElementById('res-scale-name').innerText = scaleObj.label + ' of ' + committedBaseVal + '"';
      document.getElementById('res-scale-val').innerText = toFraction(activeMark);

      renderScales();
      drawTape();
    }

    const canvas = document.getElementById('tapeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = (canvas.parentElement.clientWidth || 360) * dpr;
      canvas.height = (canvas.parentElement.clientHeight || 105) * dpr;
      drawTape();
    }

    function drawTape() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const span = 3.0;
      const startInch = Math.max(0, activeMark - (span / 2));
      const pxPerInch = w / span;
      const midY = h * 0.48;

      ctx.fillStyle = "#fdd835";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(w, midY);
      ctx.stroke();

      const totalEighths = Math.floor(span * 8) + 4;
      const firstEighth = Math.floor(startInch * 8);

      for (let i = 0; i <= totalEighths; i++) {
        const cur8 = firstEighth + i;
        const curInch = cur8 / 8;
        const x = (curInch - startInch) * pxPerInch;
        if (x < 0 || x > w) continue;

        const sub = cur8 % 8;
        let tickH = midY * 0.42;
        let lineW = 1.0 * dpr;

        if (sub === 0) {
          tickH = midY;
          lineW = 2.2 * dpr;
          ctx.fillStyle = "#111827";
          ctx.font = '900 ' + (22 * dpr) + 'px "Arial Black", Impact, sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(curInch, x + (18 * dpr), midY - (6 * dpr));
        } else if (sub === 4) {
          tickH = midY * 0.70;
          lineW = 1.6 * dpr;
        } else if (sub === 2 || sub === 6) {
          tickH = midY * 0.54;
          lineW = 1.2 * dpr;
        }

        ctx.strokeStyle = "#111827";
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tickH);
        ctx.stroke();
      }

      const startCm = startInch * 2.54;
      const pxPerCm = pxPerInch / 2.54;
      const totalMm = Math.floor(span * 2.54 * 10) + 10;
      const firstMm = Math.floor(startCm * 10);

      for (let i = 0; i <= totalMm; i++) {
        const curMm = firstMm + i;
        const curCm = curMm / 10;
        const x = (curCm - startCm) * pxPerCm;
        if (x < 0 || x > w) continue;

        const sub = curMm % 10;
        let tickH = (h - midY) * 0.35;
        let lineW = 0.9 * dpr;

        if (sub === 0) {
          tickH = (h - midY);
          lineW = 2.0 * dpr;
          ctx.fillStyle = "#111827";
          ctx.font = '800 ' + (16 * dpr) + 'px "Arial Black", Impact, sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(curCm, x + (14 * dpr), h - (6 * dpr));
        } else if (sub === 5) {
          tickH = (h - midY) * 0.65;
          lineW = 1.4 * dpr;
        }

        ctx.strokeStyle = "#111827";
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(x, h);
        ctx.lineTo(x, h - tickH);
        ctx.stroke();
      }

      const redX = (activeMark - startInch) * pxPerInch;
      if (redX >= 0 && redX <= w) {
        ctx.strokeStyle = "#dc2626";
        ctx.fillStyle = "#dc2626";
        ctx.lineWidth = 2.5 * dpr;

        ctx.beginPath();
        ctx.moveTo(redX, 0);
        ctx.lineTo(redX, h);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(redX - (6 * dpr), 0);
        ctx.lineTo(redX + (6 * dpr), 0);
        ctx.lineTo(redX, 10 * dpr);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(redX - (6 * dpr), h);
        ctx.lineTo(redX + (6 * dpr), h);
        ctx.lineTo(redX, h - (10 * dpr));
        ctx.fill();
      }
    }

    window.addEventListener('resize', resizeCanvas);
    renderScales();
    renderPad();
    resizeCanvas();
  });
</script>
</body>
</html>
