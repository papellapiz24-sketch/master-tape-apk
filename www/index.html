<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Cobra Master Tape</title>
<style>
  :root {
    --bg-dark: #0d1117;
    --panel-card: #161b22;
    --border-line: #30363d;
    --text-main: #f0f6fc;
    --text-muted: #8b949e;
    --accent-amber: #f59e0b;
    --accent-cyan: #38bdf8;
    --accent-red: #ef4444;
    --btn-key: #21262d;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px;
    justify-content: space-between;
    overflow: hidden;
  }

  /* 1. UPPER-HALF DISPLAY & TAPE STACK */
  .upper-half-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-top: 2px;
  }

  /* Input Preview Row */
  .input-bar {
    background: #0f141c;
    border: 1px solid var(--border-line);
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 6px 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .input-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .input-reading {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent-amber);
  }

  /* Final Calculated Measurement Box */
  .measurement-box {
    background: var(--panel-card);
    border: 1px solid var(--border-line);
    border-bottom: none;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .final-scale-title {
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent-cyan);
    letter-spacing: 0.6px;
  }

  .final-scale-val {
    font-size: 1.65rem;
    font-weight: 900;
    color: var(--accent-red);
  }

  /* Zero-Gap Tape directly below measurement box */
  .tape-wrapper {
    width: 100%;
    height: 100px;
    background: #090d16;
    border: 1px solid var(--border-line);
    border-radius: 0 0 10px 10px;
    position: relative;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 2. LOWER-HALF CONTROLS (SCALES & CALCULATOR PAD) */
  .lower-half-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: auto;
    padding-bottom: 2px;
  }

  /* Scales Grid */
  .grid-scales {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .btn-scale {
    background: var(--panel-card);
    color: var(--accent-cyan);
    border: 1px solid var(--border-line);
    border-radius: 7px;
    padding: 8px 2px;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: transform 0.05s;
  }

  .btn-scale.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
  }

  /* Calculation Numpad Grid */
  .grid-numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .btn-pad {
    background: var(--btn-key);
    color: var(--text-main);
    border: 1px solid var(--border-line);
    border-radius: 7px;
    font-size: 1.2rem;
    font-weight: 600;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, filter 0.1s;
  }

  .btn-pad:active, .btn-scale:active {
    transform: scale(0.96);
    filter: brightness(1.3);
  }

  .btn-op { background: #38280f; color: #fbbf24; border-color: #d97706; }
  .btn-clear { background: #3c1e1e; color: #f87171; border-color: #ef4444; }
  .btn-eq { background: #143522; color: #4ade80; border-color: #22c55e; }
  .btn-half { background: #162c46; color: #38bdf8; border-color: #0284c7; font-size: 0.9rem; }
</style>
</head>
<body>

  <!-- 1. Upper-Half Middle Focus: Measurement Box + Direct Tape -->
  <div class="upper-half-container">
    <div class="input-bar">
      <span class="input-title">Base Measurement</span>
      <span class="input-reading" id="disp-expr">38"</span>
    </div>

    <div class="measurement-box">
      <span class="final-scale-title" id="disp-scale-name">1/8 Scale</span>
      <span class="final-scale-val" id="disp-scale-val">4 3/4"</span>
    </div>

    <div class="tape-wrapper">
      <canvas id="tapeCanvas"></canvas>
    </div>
  </div>

  <!-- 2. Lower-Half Controls: Proportion Buttons + Numpad -->
  <div class="lower-half-controls">
    <div class="grid-scales" id="scaleGrid"></div>
    <div class="grid-numpad" id="numPad"></div>
  </div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    let calcExpr = "38";
    let committedBaseVal = 38.0;
    let activeMark = 38.0 / 8.0;
    let activeLabel = "1/8";
    let activeDivisor = 8;

    const scales = [
      { label: "1/2", val: 2 },
      { label: "1/3", val: 3 },
      { label: "1/4", val: 4 },
      { label: "1/6", val: 6 },
      { label: "1/8", val: 8 },
      { label: "1/10", val: 10 },
      { label: "1/12", val: 12 },
      { label: "1/16", val: 16 }
    ];

    const padKeys = [
      { k: 'C', c: 'btn-clear' }, { k: '⌫', c: '' }, { k: '/', c: 'btn-op' }, { k: '*', c: 'btn-op' },
      { k: '7', c: '' }, { k: '8', c: '' }, { k: '9', c: '' }, { k: '-', c: 'btn-op' },
      { k: '4', c: '' }, { k: '5', c: '' }, { k: '6', c: '' }, { k: '+', c: 'btn-op' },
      { k: '1', c: '' }, { k: '2', c: '' }, { k: '3', c: '' }, { k: '+1/2', c: 'btn-half' },
      { k: '0', c: '' }, { k: '.', c: '' }, { k: '(', c: '' }, { k: '=', c: 'btn-eq' }
    ];

    function toFraction(val) {
      if (val <= 0) return '0"';
      const whole = Math.floor(val);
      const rem = val - whole;
      const eighths = Math.round(rem * 8);
      if (eighths === 0) return whole + '"';
      if (eighths === 8) return (whole + 1) + '"';

      function gcd(a, b) { return b ? gcd(b, a % b) : a; }
      const div = gcd(eighths, 8);
      const num = eighths / div;
      const den = 8 / div;
      return (whole > 0 ? whole + ' ' : '') + num + '/' + den + '"';
    }

    function renderScales() {
      const grid = document.getElementById('scaleGrid');
      grid.innerHTML = '';
      scales.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'btn-scale' + (s.label === activeLabel ? ' active' : '');
        btn.innerText = s.label;
        btn.onclick = () => executeScaleCalculation(s);
        grid.appendChild(btn);
      });
    }

    function renderPad() {
      const pad = document.getElementById('numPad');
      pad.innerHTML = '';
      padKeys.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'btn-pad ' + p.c;
        btn.innerText = p.k;
        btn.onclick = () => handlePadInput(p.k);
        pad.appendChild(btn);
      });
    }

    function handlePadInput(k) {
      if (k === 'C') {
        calcExpr = "0";
      } else if (k === '⌫') {
        calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : "0";
      } else if (k === '=') {
        try {
          const evaluated = Function('"use strict";return (' + calcExpr + ')')();
          calcExpr = String(Math.round(evaluated * 1000) / 1000);
        } catch(e) {
          calcExpr = "Error";
        }
      } else if (k === '+1/2') {
        try {
          const evaluated = Function('"use strict";return (' + calcExpr + ')')();
          calcExpr = String(Math.round((evaluated + 0.5) * 1000) / 1000);
        } catch(e) {}
      } else {
        if (calcExpr === "0" || calcExpr === "Error") calcExpr = k;
        else calcExpr += k;
      }
      document.getElementById('disp-expr').innerText = calcExpr + '"';
    }

    function executeScaleCalculation(scaleObj) {
      try {
        const evaluated = Function('"use strict";return (' + calcExpr + ')')();
        committedBaseVal = Math.max(0, parseFloat(evaluated) || 0);
      } catch(e) {
        committedBaseVal = 0;
      }

      activeLabel = scaleObj.label;
      activeDivisor = scaleObj.val;
      activeMark = committedBaseVal / activeDivisor;

      document.getElementById('disp-scale-name').innerText = scaleObj.label + ' Scale';
      document.getElementById('disp-scale-val').innerText = toFraction(activeMark);

      renderScales();
      drawTape();
    }

    const canvas = document.getElementById('tapeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = (canvas.parentElement.clientWidth || 360) * dpr;
      canvas.height = (canvas.parentElement.clientHeight || 100) * dpr;
      drawTape();
    }

    function drawTape() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const span = 3.0;
      const startInch = Math.max(0, activeMark - (span / 2));
      const pxPerInch = w / span;
      const midY = h * 0.48;

      // 1. Classic Yellow Tape Background
      ctx.fillStyle = "#fdd835";
      ctx.fillRect(0, 0, w, h);

      // 2. Middle Divider
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 1.2 * dpr;
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(w, midY);
      ctx.stroke();

      // 3. Top Half: Inches & Fractions
      const totalEighths = Math.floor(span * 8) + 4;
      const firstEighth = Math.floor(startInch * 8);

      for (let i = 0; i <= totalEighths; i++) {
        const cur8 = firstEighth + i;
        const curInch = cur8 / 8;
        const x = (curInch - startInch) * pxPerInch;
        if (x < 0 || x > w) continue;

        const sub = cur8 % 8;
        let tickH = midY * 0.42;
        let lineW = 1.0 * dpr;

        if (sub === 0) {
          tickH = midY;
          lineW = 2.2 * dpr;
          ctx.fillStyle = "#111827";
          ctx.font = '900 ' + (22 * dpr) + 'px "Arial Black", Impact, sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(curInch, x + (18 * dpr), midY - (6 * dpr));
        } else if (sub === 4) {
          tickH = midY * 0.70;
          lineW = 1.6 * dpr;
        } else if (sub === 2 || sub === 6) {
          tickH = midY * 0.54;
          lineW = 1.2 * dpr;
        }

        ctx.strokeStyle = "#111827";
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, tickH);
        ctx.stroke();
      }

      // 4. Bottom Half: Metric (cm & mm)
      const startCm = startInch * 2.54;
      const pxPerCm = pxPerInch / 2.54;
      const totalMm = Math.floor(span * 2.54 * 10) + 10;
      const firstMm = Math.floor(startCm * 10);

      for (let i = 0; i <= totalMm; i++) {
        const curMm = firstMm + i;
        const curCm = curMm / 10;
        const x = (curCm - startCm) * pxPerCm;
        if (x < 0 || x > w) continue;

        const sub = curMm % 10;
        let tickH = (h - midY) * 0.35;
        let lineW = 0.9 * dpr;

        if (sub === 0) {
          tickH = (h - midY);
          lineW = 2.0 * dpr;
          ctx.fillStyle = "#111827";
          ctx.font = '800 ' + (16 * dpr) + 'px "Arial Black", Impact, sans-serif';
          ctx.textAlign = "center";
          ctx.fillText(curCm, x + (14 * dpr), h - (6 * dpr));
        } else if (sub === 5) {
          tickH = (h - midY) * 0.65;
          lineW = 1.4 * dpr;
        }

        ctx.strokeStyle = "#111827";
        ctx.lineWidth = lineW;
        ctx.beginPath();
        ctx.moveTo(x, h);
        ctx.lineTo(x, h - tickH);
        ctx.stroke();
      }

      // 5. Red Target Laser Needle
      const redX = (activeMark - startInch) * pxPerInch;
      if (redX >= 0 && redX <= w) {
        ctx.strokeStyle = "#dc2626";
        ctx.fillStyle = "#dc2626";
        ctx.lineWidth = 2.5 * dpr;

        ctx.beginPath();
        ctx.moveTo(redX, 0);
        ctx.lineTo(redX, h);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(redX - (6 * dpr), 0);
        ctx.lineTo(redX + (6 * dpr), 0);
        ctx.lineTo(redX, 10 * dpr);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(redX - (6 * dpr), h);
        ctx.lineTo(redX + (6 * dpr), h);
        ctx.lineTo(redX, h - (10 * dpr));
        ctx.fill();
      }
    }

    window.addEventListener('resize', resizeCanvas);
    renderScales();
    renderPad();
    resizeCanvas();
  });
</script>
</body>
</html>
