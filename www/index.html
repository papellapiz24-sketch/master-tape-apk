<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e17">
<title>Cobra Master Tape</title>
<style>
  :root {
    --bg-dark: #070a12;
    --panel-bg: #111827;
    --card-border: #1f293d;
    --text-white: #f9fafb;
    --text-gray: #9ca3af;
    --amber: #f59e0b;
    --cyan: #38bdf8;
    --red: #ef4444;
    --key-dark: #1e293b;
    --key-border: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: #030712;
    color: var(--text-white);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .app-frame {
    background-color: var(--bg-dark);
    width: 100%;
    max-width: 400px;
    height: 100vh;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 10px;
    border: 1px solid #1e293b;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }

  /* 1. TOP GAP */
  .top-gap {
    flex: 1 1 auto;
    min-height: 15px;
    max-height: 60px;
  }

  /* 2. MAIN ANSWER BOX + TAPE */
  .tape-section {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-bottom: 12px;
  }

  .main-answer-card {
    background: var(--panel-bg);
    border: 1px solid var(--card-border);
    border-bottom: none;
    border-radius: 12px 12px 0 0;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .main-left-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .base-label-small {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-gray);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .base-val-big {
    font-size: 1.85rem;
    font-weight: 900;
    color: var(--amber);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .main-final-val {
    font-size: 2.1rem;
    font-weight: 900;
    color: var(--red);
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .tape-display {
    width: 100%;
    height: 96px;
    background: #fdd835;
    border: 1px solid var(--card-border);
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    position: relative;
    margin: 0;
    padding: 0;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* 3. BUTTONS AREA */
  .controls-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .grid-scales {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .btn-scale {
    background: #0f1c32;
    color: var(--cyan);
    border: 1px solid #1e3a5f;
    border-radius: 7px;
    height: 38px;
    font-size: 0.9rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, background 0.15s;
  }

  .btn-scale.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.45);
  }

  .grid-numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .btn-pad {
    background: var(--key-dark);
    color: var(--text-white);
    border: 1px solid var(--key-border);
    border-radius: 7px;
    font-size: 1.25rem;
    font-weight: 700;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, filter 0.1s;
  }

  .btn-pad:active, .btn-scale:active {
    transform: scale(0.96);
    filter: brightness(1.3);
  }

  .btn-pad.span-two {
    grid-column: span 2;
  }

  .btn-op { background: #38280f; color: #fbbf24; border-color: #d97706; }
  .btn-clear { background: #3c1e1e; color: #f87171; border-color: #ef4444; }
  .btn-eq { background: #143522; color: #4ade80; border-color: #22c55e; }
  .btn-half { background: #162c46; color: #38bdf8; border-color: #0284c7; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="app-frame">

  <div class="top-gap"></div>

  <div class="tape-section">
    <div class="main-answer-card">
      <div class="main-left-group">
        <span class="base-label-small">Base Measure</span>
        <span class="base-val-big" id="disp-expr">38"</span>
      </div>
      <div class="main-final-val" id="disp-scale-val">38"</div>
    </div>

    <div class="tape-display">
      <canvas id="tapeCanvas"></canvas>
    </div>
  </div>

  <div class="controls-section">
    <div class="grid-scales" id="scaleGrid"></div>
    <div class="grid-numpad" id="numPad"></div>
  </div>

</div>

<script>
  let calcExpr = "38";
  let activeMark = 38.0;
  let activeScale = null;

  const scales = [
    { label: "1/2", val: 2 },
    { label: "1/3", val: 3 },
    { label: "1/4", val: 4 },
    { label: "1/6", val: 6 },
    { label: "1/8", val: 8 },
    { label: "1/10", val: 10 },
    { label: "1/12", val: 12 },
    { label: "1/16", val: 16 }
  ];

  // Clean Single-C Layout with Wide Zero
  const padKeys = [
    { k: 'C', c: 'btn-clear' }, { k: '⌫', c: '' }, { k: '+1/2', c: 'btn-half' }, { k: '/', c: 'btn-op' },
    { k: '7', c: '' }, { k: '8', c: '' }, { k: '9', c: '' }, { k: '*', c: 'btn-op' },
    { k: '4', c: '' }, { k: '5', c: '' }, { k: '6', c: '' }, { k: '-', c: 'btn-op' },
    { k: '1', c: '' }, { k: '2', c: '' }, { k: '3', c: '' }, { k: '+', c: 'btn-op' },
    { k: '0', c: 'span-two' }, { k: '.', c: '' }, { k: '=', c: 'btn-eq' }
  ];

  function toFraction(val) {
    if (val <= 0 || isNaN(val)) return '0"';
    const whole = Math.floor(val);
    const rem = val - whole;
    const eighths = Math.round(rem * 8);
    if (eighths === 0) return `${whole}"`;
    if (eighths === 8) return `${whole + 1}"`;

    function gcd(a, b) { return b ? gcd(b, a % b) : a; }
    const div = gcd(eighths, 8);
    const num = eighths / div;
    const den = 8 / div;
    return `${whole > 0 ? whole + ' ' : ''}${num}/${den}"`;
  }

  function evaluateCurrent() {
    try {
      const sanitized = calcExpr.replace(/[^0-9+\-*/.]/g, '');
      const evaluated = Function('"use strict";return (' + sanitized + ')')();
      return isNaN(evaluated) ? 0 : Math.max(0, evaluated);
    } catch(e) {
      return null;
    }
  }

  function renderScales() {
    const grid = document.getElementById('scaleGrid');
    grid.innerHTML = '';
    scales.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'btn-scale' + (activeScale === s.val ? ' active' : '');
      btn.innerText = s.label;
      btn.onclick = () => executeScaleCalculation(s);
      grid.appendChild(btn);
    });
  }

  function renderPad() {
    const pad = document.getElementById('numPad');
    pad.innerHTML = '';
    padKeys.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'btn-pad ' + p.c;
      btn.innerText = p.k;
      btn.onclick = () => handleInput(p.k);
      pad.appendChild(btn);
    });
  }

  function handleInput(k) {
    if (k === 'C' || k === 'Escape') {
      calcExpr = "0";
      activeMark = 0;
      activeScale = null;
      document.getElementById('disp-expr').innerText = '0"';
      document.getElementById('disp-scale-val').innerText = '0"';
      renderScales();
      drawTape();
      return;
    } 
    
    if (k === '⌫' || k === 'Backspace') {
      calcExpr = calcExpr.length > 1 ? calcExpr.slice(0, -1) : "0";
      activeScale = null;
    } else if (k === '=' || k === 'Enter') {
      const evalVal = evaluateCurrent();
      if (evalVal !== null) {
        calcExpr = String(Math.round(evalVal * 1000) / 1000);
        activeMark = evalVal;
        activeScale = null;
      } else {
        calcExpr = "Error";
      }
    } else if (k === '+1/2') {
      const evalVal = evaluateCurrent();
      if (evalVal !== null) {
        calcExpr = String(Math.round((evalVal + 0.5) * 1000) / 1000);
        activeMark = evalVal + 0.5;
        activeScale = null;
      }
    } else {
      if (calcExpr === "0" || calcExpr === "Error") {
        calcExpr = k;
      } else {
        calcExpr += k;
      }
      activeScale = null;
    }

    const currentCalculated = evaluateCurrent();
    if (currentCalculated !== null) {
      activeMark = currentCalculated;
      document.getElementById('disp-scale-val').innerText = toFraction(activeMark);
    }

    document.getElementById('disp-expr').innerText = calcExpr + '"';
    renderScales();
    drawTape();
  }

  function executeScaleCalculation(scaleObj) {
    const base = evaluateCurrent();
    const validBase = (base !== null) ? base : 0;
    
    activeScale = scaleObj.val;
    activeMark = validBase / scaleObj.val;

    document.getElementById('disp-expr').innerText = validBase + '"';
    document.getElementById('disp-scale-val').innerText = toFraction(activeMark);

    renderScales();
    drawTape();
  }

  // Physical Keyboard & Numpad Listeners
  window.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key >= '0' && key <= '9') handleInput(key);
    else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '.') handleInput(key);
    else if (key === 'Enter') { e.preventDefault(); handleInput('='); }
    else if (key === 'Backspace') handleInput('⌫');
    else if (key === 'Escape' || key.toLowerCase() === 'c') handleInput('C');
  });

  const canvas = document.getElementById('tapeCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = (canvas.parentElement.clientWidth || 360) * dpr;
    canvas.height = (canvas.parentElement.clientHeight || 96) * dpr;
    drawTape();
  }

  function drawTape() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const span = 3.0;
    const startInch = Math.max(0, activeMark - (span / 2));
    const pxPerInch = w / span;
    const midY = h * 0.48;

    // Classic Yellow Tape Body
    ctx.fillStyle = "#fdd835";
    ctx.fillRect(0, 0, w, h);

    // Center Divider Line
    ctx.strokeStyle = "#111827";
    ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath();
    ctx.moveTo(0, midY);
    ctx.lineTo(w, midY);
    ctx.stroke();

    // Top Half: Inches & Fractions
    const totalEighths = Math.floor(span * 8) + 4;
    const firstEighth = Math.floor(startInch * 8);

    for (let i = 0; i <= totalEighths; i++) {
      const cur8 = firstEighth + i;
      const curInch = cur8 / 8;
      const x = (curInch - startInch) * pxPerInch;
      if (x < 0 || x > w) continue;

      const sub = cur8 % 8;
      let tickH = midY * 0.42;
      let lineW = 1.0 * dpr;

      if (sub === 0) {
        tickH = midY;
        lineW = 2.2 * dpr;
        ctx.fillStyle = "#111827";
        ctx.font = '900 ' + (20 * dpr) + 'px "Arial Black", Impact, sans-serif';
        ctx.textAlign = "center";
        ctx.fillText(curInch, x + (16 * dpr), midY - (5 * dpr));
      } else if (sub === 4) {
        tickH = midY * 0.70;
        lineW = 1.6 * dpr;
      } else if (sub === 2 || sub === 6) {
        tickH = midY * 0.54;
        lineW = 1.2 * dpr;
      }

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = lineW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, tickH);
      ctx.stroke();
    }

    // Bottom Half: Metric (cm & mm)
    const startCm = startInch * 2.54;
    const pxPerCm = pxPerInch / 2.54;
    const totalMm = Math.floor(span * 2.54 * 10) + 10;
    const firstMm = Math.floor(startCm * 10);

    for (let i = 0; i <= totalMm; i++) {
      const curMm = firstMm + i;
      const curCm = curMm / 10;
      const x = (curCm - startCm) * pxPerCm;
      if (x < 0 || x > w) continue;

      const sub = curMm % 10;
      let tickH = (h - midY) * 0.35;
      let lineW = 0.9 * dpr;

      if (sub === 0) {
        tickH = (h - midY);
        lineW = 2.0 * dpr;
        ctx.fillStyle = "#111827";
        ctx.font = '800 ' + (15 * dpr) + 'px "Arial Black", Impact, sans-serif';
        ctx.textAlign = "center";
        ctx.fillText(curCm, x + (13 * dpr), h - (5 * dpr));
      } else if (sub === 5) {
        tickH = (h - midY) * 0.65;
        lineW = 1.4 * dpr;
      }

      ctx.strokeStyle = "#111827";
      ctx.lineWidth = lineW;
      ctx.beginPath();
      ctx.moveTo(x, h);
      ctx.lineTo(x, h - tickH);
      ctx.stroke();
    }

    // Thin Half-Length Needle (Top Zone Pointer)
    const redX = (activeMark - startInch) * pxPerInch;
    if (redX >= 0 && redX <= w) {
      ctx.strokeStyle = "#dc2626";
      ctx.fillStyle = "#dc2626";
      ctx.lineWidth = 1.5 * dpr;

      ctx.beginPath();
      ctx.moveTo(redX, 0);
      ctx.lineTo(redX, midY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(redX - (3.5 * dpr), 0);
      ctx.lineTo(redX + (3.5 * dpr), 0);
      ctx.lineTo(redX, 6 * dpr);
      ctx.fill();
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderScales();
    renderPad();
    resizeCanvas();
  });

  window.addEventListener('resize', resizeCanvas);
</script>
</body>
</html>
