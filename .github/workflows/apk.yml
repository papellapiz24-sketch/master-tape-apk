name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Cordova Project & Build APK
        run: |
          npm install -g cordova
          cordova create app com.bamniya.mastertape "Cobra Master Tape"
          cd app
          cp ../config.xml ./config.xml
          cp -r ../www/* ./www/
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobraMasterTape-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
